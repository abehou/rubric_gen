kind: rubric-gen-randomized-experiment
benchmark: paperbench-code-dev

tasks_dir: /juice2/u/nlp/data/abe_models/rubric_gen/data/paperbench-code-all-contextualized
tasks:
  - fre
  - mechanistic-understanding
  - bridging-data-gaps
  - test-time-model-adaptation
  - all-in-one
  - sequential-neural-score-estimation
  - robust-clip
  - what-will-my-model-forget
  - pinn
  - stay-on-topic-with-classifier-free-guidance
  - rice
  - sample-specific-masks
  - adaptive-pruning
  - sapg
  - lca-on-the-line
  - stochastic-interpolants
  - bbox
  - lbcs
  - bam
  - ftrl

randomization:
  seed: 20260820
  replicates: 3

seed_generator:
  provider: codex
  model: gpt-5.6-luna
  reasoning_effort: low
  service_tier: null
  executable: null
  retries: 1
  timeout_seconds: 7200

red_team_generator:
  provider: codex
  model: gpt-5.6-luna
  reasoning_effort: low
  service_tier: null
  executable: null
  retries: 1
  timeout_seconds: 7200

solvers:
  - solver_id: luna
    provider: codex
    model: gpt-5.6-luna
    reasoning_effort: low
    service_tier: null
    executable: null
    retries: 1
    timeout_seconds: 7200

assignment_selection: all

conditions:
  - condition_id: full-static
    feedback_policy: full
    rubric_policy: fixed
  - condition_id: full-offline-rubric
    feedback_policy: full
    rubric_policy: offline_elicitation
  - condition_id: full-online-rubric
    feedback_policy: full
    rubric_policy: online_elicitation
  - condition_id: full-red-team-artifact
    feedback_policy: full
    rubric_policy: red_team_artifact
  - condition_id: full-red-team-trace
    feedback_policy: full
    rubric_policy: red_team_trace
  - condition_id: semi-static
    feedback_policy: semi
    rubric_policy: fixed
  - condition_id: semi-offline-rubric
    feedback_policy: semi
    rubric_policy: offline_elicitation
  - condition_id: semi-online-rubric
    feedback_policy: semi
    rubric_policy: online_elicitation
  - condition_id: semi-red-team-artifact
    feedback_policy: semi
    rubric_policy: red_team_artifact
  - condition_id: semi-red-team-trace
    feedback_policy: semi
    rubric_policy: red_team_trace
  - condition_id: score-only-static
    feedback_policy: score_only
    rubric_policy: fixed
  - condition_id: score-only-offline-rubric
    feedback_policy: score_only
    rubric_policy: offline_elicitation
  - condition_id: score-only-online-rubric
    feedback_policy: score_only
    rubric_policy: online_elicitation
  - condition_id: score-only-red-team-artifact
    feedback_policy: score_only
    rubric_policy: red_team_artifact
  - condition_id: score-only-red-team-trace
    feedback_policy: score_only
    rubric_policy: red_team_trace
  - condition_id: user-simulator-static
    feedback_policy: user_simulator
    rubric_policy: fixed
  - condition_id: user-simulator-offline-rubric
    feedback_policy: user_simulator
    rubric_policy: offline_elicitation
  - condition_id: user-simulator-online-rubric
    feedback_policy: user_simulator
    rubric_policy: online_elicitation
  - condition_id: user-simulator-red-team-artifact
    feedback_policy: user_simulator
    rubric_policy: red_team_artifact
  - condition_id: user-simulator-red-team-trace
    feedback_policy: user_simulator
    rubric_policy: red_team_trace

protocol:
  max_revisions: 10
  min_revisions: 5
  prompt: base
  feedback_simulator:
    model: gpt-5.6-luna
    max_output_tokens: 1024
    max_concerns: 3
    max_history_bytes: 131072
    max_request_bytes: 1048576
    max_retries: 1
  judge_model: gpt-5.6-luna
  rubric_name: rubric.txt
  review: workspace
  max_review_chars: null
  rubric_proposer_model: gpt-5.6-luna
  rubric_proposer_max_retries: 5

rubric_paraphrases:
  count: 5
  selected_variant: 0
  development_variant: 1
  model: gpt-5.6-luna
  max_retries: 2

outcome_audit:
  models:
    - gpt-5.6-sol
    - claude-opus-5
    - gemini-3.6-flash
  primary_rule: any_detect
  loss_weights:
    verifier_exploitation: 1.0
    original_rubric_gap: 1.0
  max_input_tokens: 250000
  max_output_tokens: 4096
  rubric_score_max_calls: 1536000
  rubric_score_max_request_bytes: 1610612736000
  rubric_score_max_output_tokens: 50331648000
  rubric_free_evaluation_max_calls: 43200
  rubric_free_evaluation_max_request_bytes: 60397977600
  rubric_free_evaluation_max_output_tokens: 176947200

dag:
  seed:
    depends_on: []
    output_dir: ../seeds/paperbench/luna-results20
  paraphrase:
    depends_on: []
    output_dir: ../runs/rubric-paraphrases/paperbench/luna-results20
  revise:
    depends_on: [seed, paraphrase]
    output_dir: ../runs/studies/{experiment_id}
  detect:
    depends_on: [revise, paraphrase]
    output_dir: ../runs/detections/{experiment_id}
