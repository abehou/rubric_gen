kind: rubric-gen-randomized-experiment
benchmark: paperbench-code-dev

tasks_dir: /juice2/u/nlp/data/abe_models/rubric_gen/data/paperbench-code-dev-contextualized
tasks:
  - semantic-self-consistency
  - self-expansion
  - self-composing-policies

randomization:
  seed: 20260812
  replicates: 3

conditions:
  - condition_id: diligent-fixed
    prompt: diligent
    rubric_policy: fixed
  - condition_id: diligent-offline-elicitation
    prompt: diligent
    rubric_policy: offline_elicitation
  - condition_id: diligent-online-elicitation
    prompt: diligent
    rubric_policy: online_elicitation

protocol:
  revision_rounds: 6
  feedback_policy: score_only
  solver:
    provider: codex
    model: gpt-5.6-luna
    reasoning_effort: low
    service_tier: null
    executable: null
    retries: 1
    timeout_seconds: 7200
  judge_model: gpt-5.6-luna
  judge_max_retries: 1
  rubric_name: rubric.txt
  review: workspace
  max_review_chars: null
  rubric_proposer_model: gpt-5.6-luna
  rubric_semantic_judge_model: gpt-5.6-luna
  rubric_semantic_judge_max_calls_per_assignment: 5
  rubric_semantic_judge_max_request_bytes_per_call: 1048576
  rubric_semantic_judge_max_output_tokens_per_call: 32768
  rubric_proposer_max_retries: 5

rubric_paraphrases:
  count: 4
  model: gpt-5.6-luna
  max_retries: 2

outcome_audit:
  models:
    - gpt-5.6-sol
    - claude-opus-5
    - gemini-3.6-flash
  primary_rule: majority
  loss_weights:
    verifier_exploitation: 1.0
    dynamic_rubric_gap: 1.0
  max_input_tokens: 250000
  max_output_tokens: 4096
  max_event_text_chars: 65536
  max_command_output_chars: 2048
  max_retries: 1
  direct_detector_max_cost_usd: 1500
  mechanistic_max_calls: 23040
  mechanistic_max_request_bytes: 24159191040
  mechanistic_max_output_tokens: 754974720
  holistic_max_calls: 648
  holistic_max_request_bytes: 905969664
  holistic_max_output_tokens: 2654208

dag:
  seed:
    depends_on: []
    output_dir: ../seeds/paperbench-code-dev-contextualized-luna-clean-workspaces
  paraphrase:
    depends_on: []
    output_dir: ../runs/paperbench-code-dev-rubric-paraphrases/contextualized-luna-wording-only
  revise:
    depends_on: [seed, paraphrase]
    output_dir: ../runs/paperbench-code-dev-studies/{experiment_id}
  detect:
    depends_on: [revise, paraphrase]
    output_dir: ../runs/paperbench-code-dev-detections/{experiment_id}
