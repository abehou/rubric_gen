kind: rubric-gen-randomized-experiment
benchmark: biomnibench-da

tasks_dir: /juice2/u/nlp/data/abe_models/rubric_gen/data/biomnibench-da
tasks:
  - da-18-1

randomization:
  seed: 20260821
  replicates: 3

seed_generator:
  provider: codex
  model: gpt-5.6-luna
  reasoning_effort: low
  service_tier: null
  executable: null
  retries: 1
  timeout_seconds: 7200

red_team_generator:
  provider: codex
  model: gpt-5.6-luna
  reasoning_effort: low
  service_tier: null
  executable: null
  retries: 1
  timeout_seconds: 7200

solvers:
  - solver_id: luna
    provider: codex
    model: gpt-5.6-luna
    reasoning_effort: low
    service_tier: null
    executable: null
    retries: 1
    timeout_seconds: 7200

assignment_selection:
  - da-18-1--rep-001--solver-luna--full-red-team-artifact
  - da-18-1--rep-001--solver-luna--full-red-team-trace
  - da-18-1--rep-001--solver-luna--user-simulator-red-team-artifact
  - da-18-1--rep-001--solver-luna--user-simulator-red-team-trace

conditions:
  - condition_id: full-red-team-artifact
    feedback_policy: full
    rubric_policy: red_team_artifact
  - condition_id: full-red-team-trace
    feedback_policy: full
    rubric_policy: red_team_trace
  - condition_id: user-simulator-red-team-artifact
    feedback_policy: user_simulator
    rubric_policy: red_team_artifact
  - condition_id: user-simulator-red-team-trace
    feedback_policy: user_simulator
    rubric_policy: red_team_trace

protocol:
  max_revisions: 10
  min_revisions: 5
  prompt: base
  feedback_simulator:
    model: gpt-5.6-luna
    max_output_tokens: 1024
    max_concerns: 3
    max_history_bytes: 131072
    max_request_bytes: 1048576
    max_retries: 1
  judge_model: gpt-5.6-luna
  rubric_name: rubric.txt
  review: trace
  max_review_chars: null
  rubric_proposer_model: gpt-5.6-luna
  rubric_proposer_max_retries: 5

rubric_paraphrases:
  count: 5
  selected_variant: 0
  development_variant: 1
  model: gpt-5.6-luna
  max_retries: 2

outcome_audit:
  models:
    - gpt-5.6-sol
    - claude-opus-5
    - gemini-3.6-flash
  primary_rule: any_detect
  loss_weights:
    verifier_exploitation: 1.0
    original_rubric_gap: 1.0
  max_input_tokens: 250000
  max_output_tokens: 4096
  rubric_score_max_calls: 552960
  rubric_score_max_request_bytes: 144955146240
  rubric_score_max_output_tokens: 2264924160
  rubric_free_evaluation_max_calls: 1296
  rubric_free_evaluation_max_request_bytes: 1811939328
  rubric_free_evaluation_max_output_tokens: 5308416

dag:
  seed:
    depends_on: []
    output_dir: ../../seeds/biomnibench/native-prompt-dev3
  paraphrase:
    depends_on: []
    output_dir: ../../runs/rubric-paraphrases/biomnibench/luna-dev3
  revise:
    depends_on: [seed, paraphrase]
    output_dir: ../../runs/preflights/{experiment_id}
  detect:
    depends_on: [revise, paraphrase]
    output_dir: ../../runs/preflight-detections/{experiment_id}
