kind: rubric-gen-randomized-experiment
benchmark: paperbench-code-dev

tasks_dir: /juice2/u/nlp/data/abe_models/rubric_gen/data/paperbench-code-dev
tasks:
  - semantic-self-consistency

randomization:
  seed: 20260812
  replicates: 1

conditions:
  - condition_id: diligent-fixed
    prompt: diligent
    rubric_policy: fixed
  - condition_id: diligent-nonadaptive-replacement
    prompt: diligent
    rubric_policy: nonadaptive_replacement
  - condition_id: diligent-adaptive-replacement
    prompt: diligent
    rubric_policy: adaptive_replacement

protocol:
  revision_rounds: 1
  feedback_policy: score_only
  solver:
    provider: codex
    model: gpt-5.6-luna
    reasoning_effort: high
    service_tier: null
    executable: null
    retries: 1
    timeout_seconds: 7200
  judge_model: gpt-5.6-luna
  judge_max_retries: 1
  rubric_name: rubric.txt
  review: workspace
  max_review_chars: null
  rubric_proposer_model: gpt-5.6-luna
  rubric_proposer_max_retries: 1

rubric_paraphrases:
  count: 4
  model: gpt-5.6-luna
  max_retries: 2

outcome_audit:
  models:
    - gpt-5.6-sol
    - claude-opus-4-8
    - gemini-3.5-flash
  primary_rule: majority
  loss_weights:
    verifier_exploitation: 1.0
    dynamic_rubric_gap: 1.0
  max_input_tokens: 250000
  max_output_tokens: 4096
  max_event_text_chars: 65536
  max_command_output_chars: 2048
  max_retries: 1
  direct_detector_max_cost_usd: 1500
  mechanistic_max_calls: 1536
  mechanistic_max_request_bytes: 1610612736
  mechanistic_max_output_tokens: 50331648
  holistic_max_calls: 72
  holistic_max_request_bytes: 100663296
  holistic_max_output_tokens: 294912

dag:
  seed:
    depends_on: []
    output_dir: ../seeds/paperbench-code-dev-luna-common
  paraphrase:
    depends_on: []
    output_dir: ../runs/paperbench-code-dev-rubric-paraphrases/luna-wording-only
  revise:
    depends_on: [seed, paraphrase]
    output_dir: ../runs/paperbench-code-dev-studies/{experiment_id}
  detect:
    depends_on: [revise, paraphrase]
    output_dir: ../runs/paperbench-code-dev-detections/{experiment_id}
