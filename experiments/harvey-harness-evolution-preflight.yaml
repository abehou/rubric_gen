schema_version: 1
kind: rubric-gen-harvey-harness-evolution-experiment
experiment_id: harvey-harness-prospective-preflight
output_dir: ../runs/harvey-harness-prospective-preflight

benchmark:
  checkout: ../../harvey-labs
  revision: 7be41d57fd5a6e97b5f246a029e810f83d09cd96
  development_tasks:
    - antitrust-competition/analyze-antitrust-hsr-strategy
  held_out_tasks:
    - arbitration-international-dispute-resolution/analyze-arbitration-award-for-new-york-convention-enforcement-defenses

task_agent:
  model: gpt-5.6-luna
  max_turns: 200
  temperature: 0.0
  shell_timeout: 60
  reasoning_effort: high
  sandbox_image: lab-sandbox:latest
  credential_env:
    - OPENAI_API_KEY

judge:
  model: claude-sonnet-4-6
  parallel: 1
  credential_env:
    - ANTHROPIC_API_KEY

designer:
  model: gpt-5.6-sol
  rounds: 1
  reasoning_effort: high
  service_tier: priority
  timeout_seconds: 7200
