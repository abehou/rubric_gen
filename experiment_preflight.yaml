  max_input_tokens: 250000
  max_output_tokens: 4096
  max_event_text_chars: 65536
  max_command_output_chars: 2048
  max_retries: 1
  max_cost_usd: 1500

dag:
  seed:
    depends_on: []
    output_dir: runs/biomnibench-seeds/luna-proposer-preflight
