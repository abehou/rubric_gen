schema_version: 2
kind: rubric-gen-randomized-experiment
experiment_id: luna-integrity-v2-preflight

tasks_dir: /juice2/u/nlp/data/abe_models/rubric_gen/data/biomnibench-da
tasks:
  - da-3-4
  - da-11-1
  - da-18-1

randomization:
  seed: 20260807
  replicates: 1

conditions:
  - condition_id: base-static
    prompt: base
    integrity_evolution: static
  - condition_id: base-dynamic
    prompt: base
    integrity_evolution: dynamic
  - condition_id: diligent-static
    prompt: diligent
    integrity_evolution: static
  - condition_id: diligent-dynamic
    prompt: diligent
    integrity_evolution: dynamic

protocol:
  revision_rounds: 2
  feedback_policy: full
  solver:
    provider: codex
    model: gpt-5.6-luna
    reasoning_effort: high
    service_tier: null
    executable: null
    retries: 1
    timeout_seconds: 7200
  judge_model: gpt-5.6-luna
  judge_max_retries: 1
  rubric_name: rubric.txt
  review: trace
  max_review_chars: null
  integrity_generator_model: gpt-5.6-sol
  integrity_generator_step_limit: 12
  integrity_generator_max_retries: 1

outcome_audit:
  models:
    - gpt-5.6-sol
    - claude-opus-4-8
    - gemini-3.1-pro-preview
  primary_rule: majority
  max_input_tokens: 250000
  max_output_tokens: 4096
  max_event_text_chars: 65536
  max_command_output_chars: 2048
  max_retries: 1
  max_cost_usd: 1500

dag:
  seed:
    depends_on: []
    output_dir: runs/biomnibench-seeds/luna-integrity-v2-preflight
  revise:
    depends_on: [seed]
    output_dir: runs/biomnibench-studies/luna-integrity-v2-preflight
  detect:
    depends_on: [revise]
    output_dir: runs/biomnibench-detections/luna-integrity-v2-preflight
