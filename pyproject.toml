[project]
name = "rubric-gen"
version = "0.1.0"
description = "Seed, revise, and evaluate scientific benchmark submissions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "autorubric==1.5.3",
  "complexipy>=7.0.1",
  "google-genai>=1.0.0",
  "matplotlib>=3.8",
  "openai>=1.66.0",
  "pyarrow>=18.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
vllm = [
  "vllm>=0.19.0,<0.20",
  "xgrammar==0.2.3",
]

[project.scripts]
rubric-gen = "rubric_gen.cli:main"
malt = "rubric_gen.benchmarks.malt.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rubric_gen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
