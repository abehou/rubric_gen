kind: rubric-gen-randomized-experiment
benchmark: biomnibench-da

tasks_dir: data/biomnibench-da
tasks:
  - da-10-1
  - da-10-3
  - da-11-1
  - da-12-2
  - da-12-4
  - da-13-1
  - da-13-3
  - da-13-5
  - da-13-6
  - da-14-1
  - da-14-3
  - da-14-8
  - da-15-1
  - da-15-2
  - da-15-7
  - da-15-8
  - da-16-1
  - da-18-1
  - da-18-5
  - da-18-7
  - da-19-1
  - da-19-6
  - da-20-1
  - da-20-3
  - da-20-4
  - da-24-3
  - da-25-1
  - da-26-2
  - da-26-4
  - da-3-4

randomization:
  seed: 20260806
  replicates: 3

conditions:
  - condition_id: diligent-fixed
    prompt: diligent
    rubric_policy: fixed
  - condition_id: diligent-nonadaptive-replacement
    prompt: diligent
    rubric_policy: nonadaptive_replacement
  - condition_id: diligent-adaptive-replacement
    prompt: diligent
    rubric_policy: adaptive_replacement

protocol:
  revision_rounds: 6
  feedback_policy: score_only
  solver:
    provider: codex
    model: gpt-5.6-luna
    reasoning_effort: high
    service_tier: null
    executable: null
    retries: 1
    timeout_seconds: 7200
  judge_model: gpt-5.6-luna
  judge_max_retries: 1
  rubric_name: rubric.txt
  review: trace
  max_review_chars: null
  rubric_proposer_model: gpt-5.6-luna
  rubric_proposer_max_retries: 1

rubric_paraphrases:
  count: 4
  model: gpt-5.6-luna
  max_retries: 2

outcome_audit:
  models:
    - gpt-5.6-sol
    - claude-opus-4-8
    - gemini-3.5-flash
  primary_rule: majority
  loss_weights:
    verifier_exploitation: 1.0
    dynamic_rubric_gap: 1.0
  max_input_tokens: 250000
  max_output_tokens: 4096
  max_event_text_chars: 65536
  max_command_output_chars: 2048
  max_retries: 1
  direct_detector_max_cost_usd: 1500
  mechanistic_max_calls: 552960
  mechanistic_max_request_bytes: 144955146240
  mechanistic_max_output_tokens: 2264924160
  holistic_max_calls: 6480
  holistic_max_request_bytes: 9059696640
  holistic_max_output_tokens: 26542080

dag:
  seed:
    depends_on: []
    output_dir: seeds/biomnibench-luna-top30-common
  paraphrase:
    depends_on: []
    output_dir: runs/biomnibench-rubric-paraphrases/luna-wording-only
  revise:
    depends_on: [seed, paraphrase]
    output_dir: runs/biomnibench-studies/{experiment_id}
  detect:
    depends_on: [revise, paraphrase]
    output_dir: runs/biomnibench-detections/{experiment_id}
