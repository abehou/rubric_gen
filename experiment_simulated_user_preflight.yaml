kind: rubric-gen-randomized-experiment
benchmark: biomnibench-da

tasks_dir: data/biomnibench-da
tasks:
  - da-3-4
  - da-11-1
  - da-18-1

randomization:
  seed: 20260812
  replicates: 3

conditions:
  - condition_id: diligent-fixed
    prompt: diligent
    rubric_policy: fixed
  - condition_id: diligent-offline-elicitation
    prompt: diligent
    rubric_policy: offline_elicitation
  - condition_id: diligent-online-elicitation
    prompt: diligent
    rubric_policy: online_elicitation

protocol:
  revision_rounds: 2
  feedback_policy: simulated_user
  feedback_simulator:
    model: gpt-5.6-luna
    max_output_tokens: 1024
    max_aspects: 2
    max_retries: 1
  solver:
    provider: codex
    model: gpt-5.6-luna
    reasoning_effort: low
    service_tier: null
    executable: null
    retries: 1
    timeout_seconds: 7200
  judge_model: gpt-5.6-luna
  judge_max_retries: 1
  rubric_name: rubric.txt
  review: trace
  max_review_chars: null
  rubric_proposer_model: gpt-5.6-luna
  rubric_semantic_judge_model: gpt-5.6-luna
  rubric_semantic_judge_max_calls_per_assignment: 1
  rubric_semantic_judge_max_request_bytes_per_call: 1048576
  rubric_semantic_judge_max_output_tokens_per_call: 32768
  rubric_proposer_max_retries: 1

rubric_paraphrases:
  count: 4
  model: gpt-5.6-luna
  max_retries: 2

outcome_audit:
  models:
    - gpt-5.6-sol
    - claude-opus-5
    - gemini-3.6-flash
  primary_rule: majority
  loss_weights:
    verifier_exploitation: 1.0
    dynamic_rubric_gap: 1.0
  max_input_tokens: 250000
  max_output_tokens: 4096
  max_event_text_chars: 65536
  max_command_output_chars: 2048
  max_retries: 1
  direct_detector_max_cost_usd: 1500
  mechanistic_max_calls: 92160
  mechanistic_max_request_bytes: 24159191040
  mechanistic_max_output_tokens: 377487360
  holistic_max_calls: 216
  holistic_max_request_bytes: 301989888
  holistic_max_output_tokens: 884736

dag:
  seed:
    depends_on: []
    output_dir: seeds/biomnibench-luna-top30
  paraphrase:
    depends_on: []
    output_dir: runs/biomnibench-rubric-paraphrases/luna-wording-only
  revise:
    depends_on: [seed, paraphrase]
    output_dir: runs/biomnibench-studies/{experiment_id}
  detect:
    depends_on: [revise, paraphrase]
    output_dir: runs/biomnibench-detections/{experiment_id}
