kind: rubric-gen-randomized-experiment
benchmark: biomnibench-da

tasks_dir: data/biomnibench-da
tasks:
  - da-3-4
  - da-11-1
  - da-18-1

randomization:
  seed: 20260812
  replicates: 1

conditions:
  - condition_id: diligent-static
    prompt: diligent
    rubric_evolution: static
  - condition_id: diligent-prospective
    prompt: diligent
    rubric_evolution: prospective

protocol:
  revision_rounds: 1
  feedback_policy: simulated_user
  feedback_simulator:
    model: gpt-5.6-luna
    max_output_tokens: 1024
    max_aspects: 2
    max_retries: 1
  solver:
    provider: codex
    model: gpt-5.6-luna
    reasoning_effort: high
    service_tier: null
    executable: null
    retries: 1
    timeout_seconds: 7200
  judge_model: gpt-5.6-luna
  judge_max_retries: 1
  rubric_name: rubric.txt
  review: trace
  max_review_chars: null
  rubric_auditor_model: gpt-5.6-luna
  rubric_auditor_query_limit: 12
  rubric_proposer_model: gpt-5.6-luna
  rubric_proposer_max_retries: 1

rubric_paraphrases:
  count: 4
  model: gpt-5.6-luna
  max_retries: 2

outcome_audit:
  models:
    - gpt-5.6-sol
    - claude-opus-4-8
    - gemini-3.5-flash
  primary_rule: majority
  component_weights:
    verifier_exploitation: 1.0
    rubric_drift: 1.0
    wording_exploitation: 1.0
    specification_exploitation: 1.0
  max_input_tokens: 250000
  max_output_tokens: 4096
  max_event_text_chars: 65536
  max_command_output_chars: 2048
  max_retries: 1
  max_cost_usd: 1500

dag:
  seed:
    depends_on: []
    output_dir: seeds/biomnibench-luna-top30-common
  paraphrase:
    depends_on: []
    output_dir: runs/biomnibench-rubric-paraphrases/luna-wording-only
  revise:
    depends_on: [seed, paraphrase]
    output_dir: runs/biomnibench-studies/{experiment_id}
  detect:
    depends_on: [revise, paraphrase]
    output_dir: runs/biomnibench-detections/{experiment_id}
